services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: learn_urhobo
      POSTGRES_USER: urhobo
      POSTGRES_PASSWORD: urhobo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DB_NAME: learn_urhobo
      DB_USER: urhobo
      DB_PASSWORD: urhobo
      DB_HOST: db
      DB_PORT: 5432
      SECRET_KEY: dev-secret-key-change-in-production
      DEBUG: "True"

volumes:
  pgdata:
